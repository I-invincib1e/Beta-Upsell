# This file stores configurations for your Shopify app.

client_id = "71c0d5b7b05db41c52286ce4d0e4f3c0"
name = "Upsell"
application_url = "https://beta-upsell-production.up.railway.app"
embedded = true

[auth]
redirect_urls = [
  "https://beta-upsell-production.up.railway.app/auth/callback",
  "https://beta-upsell-production.up.railway.app/auth/shopify/callback",
  "https://beta-upsell-production.up.railway.app/api/auth/callback"
]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products"

# Storefront: https://{shop}.myshopify.com/apps/beta-upsell/api/* → app /api/*
[app_proxy]
url = "https://beta-upsell-production.up.railway.app"
subpath = "beta-upsell"
prefix = "apps"

[webhooks]
api_version = "2025-01"

  # Handled by: /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  # Handled by: /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # Mandatory compliance webhooks (public apps) — /app/routes/webhooks.gdpr.ts
  [[webhooks.subscriptions]]
  uri = "/webhooks/gdpr"
  compliance_topics = ["customers/data_request"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/gdpr"
  compliance_topics = ["customers/redact"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/gdpr"
  compliance_topics = ["shop/redact"]
